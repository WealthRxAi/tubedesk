<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TubeDesk — TikTok connection</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e8ecf2;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px}.card{max-width:560px;background:#171b24;border:1px solid #262c3a;border-radius:14px;padding:28px}h1{font-size:20px;margin:0 0 8px}code{display:block;background:#0b0d12;border:1px solid #262c3a;border-radius:8px;padding:12px;word-break:break-all;font-size:14px;margin:12px 0}button{background:#ffd60a;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.mute{color:#8d96a7;font-size:13px}</style></head>
<body><div class="card"><h1>TikTok connected — one step left</h1><p>Copy this code and paste it into TubeDesk → Settings → TikTok → <b>Finish</b>. It expires in a few minutes and only works together with your app secret on your own machine.</p><code id="code">…</code><button id="copy">Copy code</button><p class="mute" id="note"></p></div>
<script>const p=new URLSearchParams(location.search);const c=p.get('code');const el=document.getElementById('code');if(c){el.textContent=c}else{el.textContent='No code in this URL.';document.getElementById('note').textContent=p.get('error_description')||p.get('error')||'Start the connection again from TubeDesk.'}document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(c||'');document.getElementById('copy').textContent='Copied'}catch{}};</script></body></html>
